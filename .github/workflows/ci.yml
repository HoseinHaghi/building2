name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm --prefix server ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit
      - run: npm --prefix server audit
      - run: docker compose --env-file .env.production.example config --quiet
      - run: docker build -t building:test .
      - name: Container smoke test
        run: |
          docker run -d --name building-smoke -p 127.0.0.1:5000:5000 -e APP_ORIGIN=https://example.test building:test
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:5000/api/health; then exit 0; fi
            sleep 2
          done
          docker logs building-smoke
          exit 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            playwright-report/
            test-results/
